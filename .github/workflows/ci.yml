name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the package has no third-party dependencies
        run: |
          python - <<'PY'
          import tomllib, pathlib, sys
          meta = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          deps = meta["project"]["dependencies"]
          if deps:
              sys.exit(f"keygate must stay stdlib-only, found: {deps}")
          print("stdlib-only: ok")
          PY

      - name: Test
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: |
          keygate --version
          keygate init /tmp/kg-smoke
          KEYGATE_DIR=/tmp/kg-smoke keygate user add alice --budget 5
          KEYGATE_DIR=/tmp/kg-smoke keygate user mint alice --label ci
          KEYGATE_DIR=/tmp/kg-smoke keygate user list
          KEYGATE_DIR=/tmp/kg-smoke keygate key list
          KEYGATE_DIR=/tmp/kg-smoke keygate usage
          KEYGATE_DIR=/tmp/kg-smoke keygate audit
