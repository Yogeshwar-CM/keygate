[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keygate"
version = "0.1.0"
description = "Local org API-key gateway: one real upstream key, per-user virtual keys, budgets, audit log."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["openai", "api-key", "gateway", "proxy", "budget", "llmops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
keygate = "keygate.cli:main"

[project.urls]
Homepage = "https://github.com/keygate-dev/keygate"
Issues = "https://github.com/keygate-dev/keygate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
